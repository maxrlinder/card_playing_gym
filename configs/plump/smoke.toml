# A seconds-long CPU run that exercises every part of the pipeline:
#   cardgym plump train smoke --config configs/plump/smoke.toml

[run]
game = "plump"
iterations = 3
checkpoint_every = 1
device = "cpu"
precision = "fp32"
seed = 0

[rollout]
kv_dtype = "fp32"
max_rows = 1024

[model]
d_model = 32
n_layers = 2
n_heads = 4
n_kv_heads = 2
d_ff = 64
per_layer_dim = 8
value_embeddings = "alternating"

[ppo]
learning_rate = 0.001
lr_warmup_updates = 1
clip_ratio = 0.2
critic_epochs = 2
actor_value_coef = 0.2
auxiliary_grad_fraction = 0.25
entropy_targets = { bid = 0.5, play = 0.5 }
microbatch_positions = 1024

[game]
hand_sizes = [3, 5, 10]
player_counts = [3, 5]
deals_per_shape = 2

[losses]
