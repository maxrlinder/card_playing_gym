# First Rummy recipe: the architecture of docs/rummy.md at a starting size.
# Model width, depth, entropy floors, and batch size are untuned. Run with the
# fused Metal kernels (trunk and card grid):
#   CARDGYM_METAL_TRUNK=1 cardgym rummy train r1 --config configs/rummy/base.toml

[run]
game = "rummy"
iterations = 20000
checkpoint_every = 100
dashboard_every = 50
device = "auto"
precision = "bf16"
seed = 0

[rollout]
kv_dtype = "fp16"
# Keep every lane's games in flight and refill as they end: a collection costs
# about quota * mean length / in_flight waves instead of the longest game.
mode = "continuous"
concurrency = 1.0
# Collect the next batch in a separate process during the update. The rollout
# (~12k decisions/s) then hides behind the update; policy lag is ~2 versions.
asynchronous = true

[model]
d_model = 256
n_layers = 8
n_heads = 8
n_kv_heads = 2
d_ff = 768
per_layer_dim = 64
value_embeddings = "alternating"
ledger_width = 32
ledger_hidden = 64
ledger_layers = 2
ledger_kernel = 5
score_dim = 64

[ppo]
learning_rate = 3e-4
lr_warmup_updates = 10
clip_ratio = 0.2
# From scratch, optimizer steps per hour are what limit early learning.
epochs = 2
max_grad_norm = 1.0
advantage_estimator = "monte_carlo"
critic_learning_rate = 3e-4
critic_epochs = 2
# Returns are relative points; a typical round moves tens of them.
value_reward_scale = 50.0
actor_value_coef = 0.2
auxiliary_grad_fraction = 0.25
entropy_mode = "adaptive"
entropy_targets = { draw = 0.15, play = 0.15 }
# Own decisions plus opponent turns: streams are ~40 tokens, rarely past 128.
microbatch_positions = 16384
sequence_bucket_width = 16
critic_sequence_bucket_width = 16
min_group_sequences = 32

[game]
# Every (players, decks, hand size) combination is a lane: an update mixes
# 2-4 players with one and two decks, seven cards each.
player_counts = [2, 3, 4]
decks = [1, 2]
hand_sizes = [7]
games_per_shape = 24
opening_points = 0
max_turns = 200

[losses]
hands = 0.2
winner = 0.1
penalty = 0.1
